<html><body style="margin:0"><script src="three-r186.min.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x7fb0e0);const RCX=0,RCZ=20;
scene.add(new THREE.HemisphereLight(0xffffff,0x667788,1.6));const d=new THREE.DirectionalLight(0xffffff,1.5);d.position.set(5,10,5);scene.add(d);
const birds=[];{
  // v272: proper birds: tapered body, head and beak, fanned tail, two-joint feathered wings that flap in bursts and glide between
  const wing=(pts)=>{const sh=new THREE.Shape();pts.forEach(([x,y],i)=>i?sh.lineTo(x,y):sh.moveTo(x,y));sh.closePath();const g=new THREE.ShapeGeometry(sh);g.rotateX(Math.PI/2);return g};
  const gIn=wing([[0,.2],[.35,.24],[.62,.2],[.62,-.2],[.4,-.3],[0,-.26]]);
  const gOut=wing([[0,.2],[.4,.12],[.78,-.05],[.74,-.16],[.6,-.1],[.5,-.3],[.34,-.2],[.2,-.34],[0,-.2]]);
  const gTail=wing([[-.1,0],[.1,0],[.24,-.5],[.1,-.42],[0,-.55],[-.1,-.42],[-.24,-.5]]);
  const gBody=new THREE.SphereGeometry(1,10,8);const gHead=new THREE.SphereGeometry(.1,8,6);const gBeak=new THREE.ConeGeometry(.04,.14,6);gBeak.rotateX(Math.PI/2);
  const kinds=[[0x23262b,0x1b1d21,0x2a2a2a],[0x23262b,0x1b1d21,0x2a2a2a],[0x2b2d31,0x202226,0xd09a2a],[0xeceae4,0x9aa3ab,0xe0a030],[0xeceae4,0x8e979f,0xe0a030],[0xe6e3dc,0x7f8890,0xe0a030],[0x23262b,0x1b1d21,0x2a2a2a]];
  for(let i=0;i<7;i++){const k=kinds[i],bodyM=new THREE.MeshLambertMaterial({color:k[0]}),wingM=new THREE.MeshLambertMaterial({color:k[1],side:THREE.DoubleSide}),beakM=new THREE.MeshLambertMaterial({color:k[2]});
    const g=new THREE.Group();g.rotation.order='YXZ';const sc=.85+Math.random()*.5;g.scale.setScalar(sc);
    const body=new THREE.Mesh(gBody,bodyM);body.scale.set(.15,.13,.42);g.add(body);const head=new THREE.Mesh(gHead,bodyM);head.position.set(0,.03,.44);g.add(head);const beak=new THREE.Mesh(gBeak,beakM);beak.position.set(0,.02,.56);g.add(beak);
    const tail=new THREE.Mesh(gTail,wingM);tail.position.set(0,0,-.34);g.add(tail);
    const mk=sd=>{const sh=new THREE.Group();sh.position.set(sd*.1,.06,.08);sh.scale.x=sd;const inn=new THREE.Mesh(gIn,wingM);sh.add(inn);const el=new THREE.Group();el.position.x=.62;const out=new THREE.Mesh(gOut,wingM);el.add(out);sh.add(el);g.add(sh);return [sh,el]};
    const [p1,e1]=mk(1),[p2,e2]=mk(-1);scene.add(g);
    birds.push({g,p1,p2,e1,e2,tail,r:30+Math.random()*30,h:34+Math.random()*16,sp:.06+Math.random()*.05,ph:Math.random()*6.28,fl:6+Math.random()*2.5,glide:.35+Math.random()*.3})}}
function updateBirds(t){const s=t/1000;birds.forEach(b=>{const a=b.ph+s*b.sp,y0=b.g.position.y;b.g.position.set(Math.cos(a)*b.r+RCX,b.h+Math.sin(s*.7+b.ph)*2,Math.sin(a)*b.r*.7+RCZ-20);
    b.g.rotation.y=-a;b.g.rotation.z=-.28;b.g.rotation.x=Math.cos(s*.7+b.ph)*.12;
    // flap in bursts, then hold the wings out and glide
    const burst=Math.sin(s*.45+b.ph*2);const amp=Math.max(0,Math.min(1,(burst+b.glide-.5)*2.2));const ph=s*b.fl+b.ph,f=Math.sin(ph)*.75*amp+(1-amp)*(.1+Math.sin(s*.9+b.ph)*.04);
    b.p1.rotation.z=f;b.p2.rotation.z=-f;const fo=Math.sin(ph-.9)*.55*amp+(1-amp)*.06;b.e1.rotation.z=fo;b.e2.rotation.z=-fo;
    b.tail.rotation.x=-.08+Math.sin(s*1.3+b.ph)*.05+(amp>.3?Math.cos(ph)*.06:0)})}

const cam=new THREE.PerspectiveCamera(40,1,.1,500);const r=new THREE.WebGLRenderer({antialias:true});r.setSize(800,500);document.body.appendChild(r.domElement);
birds.forEach((b,i)=>{scene.remove(b.g)});
const out=[];birds.slice(0,6).forEach((b,i)=>{const c=b.g;scene.add(c);c.position.set((i%3-1)*3.2,(i<3?1.2:-1.2),0);c.rotation.set(.35,2.2,-.25);
 const amp=[1,1,1,0,0,0][i];const f=[-.6,.1,.7,.1,.1,.1][i];b.p1.rotation.z=f;b.p2.rotation.z=-f;b.e1.rotation.z=f*.7;b.e2.rotation.z=-f*.7});
cam.position.set(0,2,9);cam.lookAt(0,0,0);cam.aspect=1.6;cam.updateProjectionMatrix();r.render(scene,cam);window.done=1;
</script></body></html>
